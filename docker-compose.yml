# UNTESTED in the authoring environment (no Docker available). Provided for reproducibility; see docs/KNOWN_LIMITATIONS.md
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: mg, POSTGRES_PASSWORD: mg, POSTGRES_DB: mandateguard }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mg"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [{ path: backend/.env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://mg:mg@db:5432/mandateguard
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
